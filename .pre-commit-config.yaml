fail_fast: true
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-json
    -   id: check-merge-conflict
    -   id: debug-statements
  # Ruff and ty run through uv so pre-commit, the Makefile, and CI all use the
  # exact versions pinned in uv.lock (no drift between hook revs and the lock).
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true
      - id: ty
        name: ty check
        entry: uv run ty check drdmannturb
        language: system
        types: [python]
        pass_filenames: false

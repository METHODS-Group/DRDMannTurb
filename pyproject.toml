[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drdmannturb"
version = "1.1-beta.0"
description = "Synthetic turbulence generation software, focused on a data-driven extension of the Mann turbulence model"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "BSD-2-Clause"
authors = [
  {name = "Alexey Izmailov", email = "alizma@brown.edu"},
  {name = "Matthew Meeker", email = "meeker.matthew@utexas.edu"},
  {name = "Yorgos Deskos"},
  {name = "Brendan Keith"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "matplotlib>=3.10",
    "numba>=0.60.0",
    "numpy>=2.0",
    "plotly>=5.17",
    "polars>=1.29.0",
    "pyevtk>=1.6.0",
    "pyFFTW>=0.15.0",
    "scipy>=1.13.1",
    "tensorboard>=2.19.0",
    "torch>=2.7",
]

[project.urls]
Homepage = "https://github.com/METHODS-Group/DRDMannTurb"

[project.optional-dependencies]
# Only what docs/source/conf.py actually loads.
docs = [
    "ipython",
    "Sphinx>=7",
    "pydata-sphinx-theme>=0.14.2",
    "sphinxcontrib-mermaid",
    "sphinx-gallery>=0.19.0",
    "myst_parser",
    # NOTE: tensorboard, plotly are already core dependencies
]

[tool.setuptools.packages.find]
include = ["drdmannturb*"]

# Ruff configuration below
[tool.ruff]
# Enable pydocstyle (`D`), pycodestyle (`E`), Pyflakes (`F`), import sorting (`I`),
# and pyupgrade (`UP`, replaces the former standalone pyupgrade pre-commit hook)
lint.select = ["D", "E", "F", "I", "UP"]
lint.ignore = []

# Configure docstring style
lint.pydocstyle.convention = "numpy"

# Allow unused variables when underscore-prefixed.
lint.dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "runs",
    "paper",
]

# Same as Black.
line-length = 120

# Assume Python >=3.10
target-version = "py310"

# ty (type checker) configuration
# NOTE: The rules below are temporarily downgraded to "warn" to cover ~30
# pre-existing diagnostics in code slated for rewrite during the JAX migration
# (mostly calibration.py plotting and fluctuation_generation). Revert these to
# error-level as each module is migrated.
[tool.ty.rules]
no-matching-overload = "warn"
invalid-argument-type = "warn"
unresolved-attribute = "warn"
not-subscriptable = "warn"
not-iterable = "warn"
invalid-return-type = "warn"
unsupported-operator = "warn"
unknown-argument = "warn"
call-non-callable = "warn"

[tool.ty.terminal]
# The rules above are tracked tech debt; report them without failing the check.
error-on-warning = false

[tool.pytest.ini_options]
minversion = "7.0"
pythonpath = ["."]
testpaths = ["test"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=6.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.12",
    "ty",
    "ipykernel",
]
# Used only by the STORM_fitting research scripts/notebooks, not by the package.
storm = [
    "netcdf4",
    "scikit-learn>=1.4.0",
    "tqdm>=4.67",
    "xarray>=2024.7.0",
]

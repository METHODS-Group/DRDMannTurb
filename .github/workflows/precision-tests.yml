name: Precision Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  precision-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        precision: [float32, float64]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run precision tests (${{ matrix.precision }})
        run: uv run pytest --group=precision --precision=${{ matrix.precision }} -v
